name: Android CI/CD Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v1.0.0). If left empty, a timestamp-based tag will be generated.'
        required: false
        type: string
        default: ''
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

# Least privilege by default. The build job runs contributor-controlled Gradle
# logic on pull requests, so the default token must not be able to write. The
# release job re-grants `contents: write` for itself only.
permissions:
  contents: read

jobs:
  # Runs on every event, including pull_request. It holds no signing material:
  # no release keystore, no STORE_PASSWORD/KEY_PASSWORD, and a read-only token.
  # Anything a contributor can influence through a pull request is confined here.
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Do not leave the checkout token in .git/config for the rest of the
          # job: on a pull request the following steps execute contributor-
          # controlled Gradle build logic.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 9.7.0 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Prepare .env File
        run: |
          echo "Setting up .env file..."
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # GEMINI_API_KEY is never packaged into the APK (P0-3):
          # - .env.example contains no secret value (commented out);
          # - app/build.gradle.kts secrets { ignoreList } blocks GEMINI_API_KEY
          #   from BuildConfig even if present in .env.
          # Users provide their own key via the in-app Settings screen
          # (stored locally on device). Never add real keys to .env in CI.

      # A throwaway debug key, generated fresh on every run. It is not a secret
      # and is deliberately kept out of the release job, which uses the upload key.
      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore || base64 -D debug.keystore.base64 > debug.keystore || true
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Generating debug.keystore via keytool..."
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      # N-4 (audit 2026-09-17): androidTest sources were never compiled in CI, so
      # a broken instrumented test could reach main unnoticed — the same class of
      # failure that already happened once with unit tests. Compiling the source
      # set catches that without needing an emulator; running it on a device
      # would be the next step.
      - name: Compile Instrumented Tests (androidTest)
        run: ./gradlew assembleDebugAndroidTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Collect and Rename Debug Artifacts
        run: |
          mkdir -p outputs/

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk outputs/LexiRead-debug.apk
          fi

          echo "Generated artifacts in outputs/:"
          ls -la outputs/

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: lexiread-debug-artifacts
          path: outputs/*
          if-no-files-found: error
          retention-days: 14

  # The only job that ever sees the upload keystore or the signing passwords.
  #
  # P0-CI (audit 2026-09-18): this used to be the same job as `build`, so a
  # pull_request — the lowest-trust trigger the workflow accepts — reached the
  # step that decodes RELEASE_KEYSTORE_BASE64 into the workspace and the step that
  # runs `assembleRelease` with STORE_PASSWORD/KEY_PASSWORD in its environment.
  # Contributor-controlled Gradle build logic therefore ran with the release
  # signing material present. Gating the job on the event keeps the two apart.
  #
  # `environment: release` is the hook for adding required reviewers to a
  # publish; GitHub creates the environment with no protection rules if it does
  # not exist yet, so this changes nothing until it is configured.
  #
  # Note the trade-off: no release-variant build runs on a pull request, so an
  # R8/minify-only regression is first seen after merge. The alternative is
  # running the release pipeline on contributor-controlled input, which is the
  # finding this split closes.
  release:
    name: Build Signed Release & Publish
    needs: build
    # Only a tag push or an explicit manual run asks for a release. This used to
    # be `github.event_name != 'pull_request'`, so *every* push to main cut a
    # `v1.0.<run_number>` release - ten of them exist (v1.0.16 .. v1.0.25), all
    # debug-signed, because the signing secrets were never configured. It also
    # turned CI red on ordinary commits. README already documents releases as
    # tag-driven, so this now matches it.
    #
    # With the guard in app/build.gradle.kts this means: a tag push with no
    # signing secrets fails loudly (you asked for a release, you get told you
    # cannot have one), while a normal push to main no longer involves the
    # release pipeline at all.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 9.7.0 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Prepare .env File
        run: |
          echo "Setting up .env file..."
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi
          # See the build job: no real key ever belongs in .env in CI.

      - name: Prepare Keystore Files
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore || base64 -D debug.keystore.base64 > debug.keystore || true
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Generating debug.keystore via keytool..."
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

          # If custom release keystore secret is provided in base64
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          fi

      - name: Build Release APK & Bundle (AAB)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          # Tag pushes expose version via GITHUB_REF_NAME; dispatch custom
          # tags arrive only via inputs, so forward explicitly (env:, not bash).
          RELEASE_VERSION: ${{ github.event.inputs.release_tag }}
        run: |
          # P2-10 + N-2: this step must fail loudly when release signing or the
          # build is broken. app/build.gradle.kts now refuses to assemble a
          # release artifact in CI when no upload keystore/passwords are present,
          # so a missing secret can no longer produce a debug-signed APK that
          # looks like a real release.
          ./gradlew assembleRelease bundleRelease

      - name: Collect and Rename Artifacts
        run: |
          mkdir -p outputs/

          # This job never builds a debug variant, so the `app-debug.apk` copy
          # that used to live here could never fire - it just implied otherwise.
          #
          # Both release artifacts are required: the whole point of this job is
          # to publish them, so a missing one fails here instead of uploading a
          # silently partial set.
          test -f app/build/outputs/apk/release/app-release.apk || {
            echo "::error::app-release.apk was not produced"; exit 1; }
          test -f app/build/outputs/bundle/release/app-release.aab || {
            echo "::error::app-release.aab was not produced"; exit 1; }

          cp app/build/outputs/apk/release/app-release.apk outputs/LexiRead-release.apk
          cp app/build/outputs/bundle/release/app-release.aab outputs/LexiRead-release.aab

          echo "Generated artifacts in outputs/:"
          ls -la outputs/

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: lexiread-build-artifacts
          path: outputs/*
          if-no-files-found: error
          retention-days: 14

      - name: Determine Release Tag
        id: release_info
        # The `push to main` clause that used to be here is gone: the job itself
        # no longer runs on that event, so it was unreachable.
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release != 'false')
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
          GITHUB_RUN_NUMBER_ENV: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "$RELEASE_TAG_INPUT" && "$RELEASE_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z._-]+)?$ ]]; then
            TAG_NAME="$RELEASE_TAG_INPUT"
          else
            if [ -n "$RELEASE_TAG_INPUT" ]; then echo "::warning::Ignoring invalid release_tag, using default."; fi
            TAG_NAME="v1.0.$GITHUB_RUN_NUMBER_ENV"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Release tag determined: ${TAG_NAME}"

      - name: Create GitHub Release and Upload Assets
        if: steps.release_info.outputs.tag_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag_name }}
          IS_PRERELEASE: ${{ github.event.inputs.is_prerelease }}
        run: |
          TAG="$RELEASE_TAG"
          FLAGS=""
          if [ "$IS_PRERELEASE" = "true" ]; then FLAGS="$FLAGS --prerelease"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "LexiRead $TAG" --generate-notes $FLAGS
          gh release upload "$TAG" outputs/* --clobber
