<?xml version="1.0" encoding="UTF-8"?>
<!--
  LexiRead app icon — concept C "Open Book".

  The biggest departure: the slab opens into two leaves with a bookmark rising
  out of the gutter. Still a book and still a bookmark, but the silhouette is
  now LexiRead's own rather than a variation on Openlib's closed slab.

  Construction (viewBox 0 0 256 256, tile 224 px):
    tile     x 16..240, rx 50
    fold     x 128 — the two leaves butt together, so the mark stays one solid
             shape with no slit to read as a rendering fault
    leaves   outer edges x 46 / 210; each top edge falls 22 px over 82 px of run
             (15.03°, i.e. a clean 15°) from the outer edge down to the fold, and
             each bottom edge falls the same way, giving the classic open-book V.
             left  leaf (128,92) (46,70) (46,166) (128,188)
             right leaf (128,92) (210,70) (210,166) (128,188)
    ribbon   x 117..139, centred on the fold; top y 66 (23 px clear of the leaf
             edge), bottom y 154, notch 19 deep over an 11 px half-width (60°)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img"
     aria-label="LexiRead">
  <title>LexiRead</title>
  <rect x="16" y="16" width="224" height="224" rx="50" fill="#F6F2EB"/>
  <path d="M128 92 L46 70 L46 166 L128 188 Z" fill="#0F172A"/>
  <path d="M128 92 L210 70 L210 166 L128 188 Z" fill="#0F172A"/>
  <path d="M117 66 H139 V154 L128 135 L117 154 Z" fill="#D4AC54"/>
</svg>
